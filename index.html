<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.C.O.P.E. V6 | Connecting...</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            /* Matched exactly to the V6 Auth Panel Slate Background */
            background-color: #0f172a; 
            display: flex;
            justify-content: center; align-items: center;
            overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .ambient-glow {
            position: absolute; width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(2, 132, 199, 0.2) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
        }

        .loader-wrapper {
            position: relative; z-index: 2;
            display: flex; flex-direction: column; align-items: center;
        }

        .logo-container {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .rotating-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top: 3px solid #38bdf8;    
            border-right: 3px solid #0284c7;  
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.4); 
            animation: spinRing 1.5s linear infinite; 
        }

        /* NEW V6 TEXT LOGO (Replaces old image) */
        .app-logo-text {
            position: absolute;
            z-index: 3;
            color: #ffffff;
            font-size: 22px;
            font-weight: 900;
            text-align: center;
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .app-logo-text span {
            display: block;
            color: #38bdf8;
            font-size: 12px;
            letter-spacing: 4px;
            margin-top: 2px;
        }

        .status-text {
            color: #94a3b8; font-size: 11px; letter-spacing: 4px;
            text-transform: uppercase; margin-top: 35px; font-weight: 600;
            animation: pulseText 1.5s infinite;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseText {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                // V6 SYSTEM TARGET URL
                window.location.replace("https://script.google.com/macros/s/AKfycbx9bRBEYoyq_DkWKTrMbRSWm6eEMIaOL8dIEwWaNaGVTHuFVAkYmbkIC_eZ50d3MD8c/exec");
            }, 1800); 
        });
    </script>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="loader-wrapper">
        <div class="logo-container">
            <div class="rotating-ring"></div>
            <div class="app-logo-text">
                BTH<span>SCOPE</span>
            </div>
        </div>
        <div class="status-text">Securing V6 Node</div>
    </div>
</body>
</html>
